name: Deploy Development

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate development release
        run: pnpm check

      - name: Verify required Worker secrets
        run: |
          configured_secrets="$(pnpm wrangler secret list --env development --format json)"
          for required_secret in PRIVATE_DATA_ENCRYPTION_KEY ADMIN_AUTH_SECRET; do
            if ! jq -e --arg name "$required_secret" 'map(.name) | index($name) != null' <<<"$configured_secrets" >/dev/null; then
              echo "Required development Worker secret is not configured: $required_secret" >&2
              exit 1
            fi
          done

      - name: Apply development D1 migrations
        run: pnpm wrangler d1 migrations apply DB --env development --remote

      - name: Verify no development migrations remain
        run: |
          migration_status="$(pnpm wrangler d1 migrations list DB --env development --remote)"
          printf '%s\n' "$migration_status"
          grep -q "No migrations to apply" <<<"$migration_status"

      - name: Deploy development Worker and frontend assets
        id: deploy
        run: |
          deploy_output="$(pnpm wrangler deploy --env development 2>&1)"
          printf '%s\n' "$deploy_output"
          deploy_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' <<<"$deploy_output" | tail -n 1)"
          if [[ -z "$deploy_url" ]]; then
            echo "Wrangler did not report a workers.dev development URL." >&2
            exit 1
          fi
          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"

      - name: Run development smoke checks
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke-production.mjs
