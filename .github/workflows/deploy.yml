name: Deploy

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: pnpm check

      - name: Deploy Worker and frontend assets
        id: deploy
        run: |
          deploy_output="$(pnpm wrangler deploy 2>&1)"
          printf '%s\n' "$deploy_output"
          deploy_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' <<<"$deploy_output" | tail -n 1)"
          if [[ -z "$deploy_url" ]]; then
            echo "Wrangler did not report a workers.dev production URL." >&2
            exit 1
          fi
          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"

      - name: Run production smoke checks
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke-production.mjs
