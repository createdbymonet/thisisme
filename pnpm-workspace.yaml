packages:
  - '.'

# Dependencies that genuinely require install/build scripts are explicitly
# allowed with `true`. Dependencies whose install scripts are unnecessary for
# this project are explicitly blocked with `false`.
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: false
  esbuild: true
  tree-sitter: true
  tree-sitter-json: true
  workerd: true
